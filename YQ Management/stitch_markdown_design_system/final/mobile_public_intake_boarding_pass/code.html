<body class="bg-surface text-on-surface flex items-center justify-center min-h-screen p-4 sm:p-8 font-body-md text-body-md antialiased">
<!-- Simulated Smartphone Container -->
<div class="w-full max-w-md mx-auto min-h-screen sm:min-h-[850px] sm:h-[850px] sm:rounded-[2.5rem] sm:border-[8px] border-zinc-800 relative overflow-hidden shadow-2xl bg-zinc-950 text-zinc-50 flex flex-col">
<!-- TopAppBar (Simulated Mobile Nav) -->
<header class="fixed sm:absolute top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-header-h bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800/50">
<div class="flex items-center gap-3">
<button class="hover:opacity-80 transition-opacity flex items-center justify-center w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md font-bold text-zinc-100 tracking-tight">Qmova</span>
</div>
<button class="text-zinc-400 hover:text-zinc-100 transition-colors w-10 h-10 flex items-center justify-center">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Main Scrollable Canvas -->
<main class="flex-1 overflow-y-auto pt-header-h pb-24 px-4 scroll-smooth" id="main-container">
<!-- State A: Intake Form -->
<div class="flex flex-col h-full transition-opacity duration-300" id="state-a">
<div class="mt-8 mb-6 text-center">
<h1 class="font-headline-lg text-headline-lg text-zinc-50 mb-2">Johns Hopkins Outpatient</h1>
<p class="font-body-md text-body-md text-zinc-400">Digital Intake Router</p>
</div>
<div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-lg flex-1 flex flex-col gap-8">
<!-- Mobile Input -->
<div>
<label class="block font-label-caps text-label-caps text-zinc-400 mb-3 tracking-widest uppercase">Mobile Number</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-zinc-500 font-data-mono text-data-mono">+1</span>
<input class="w-full bg-zinc-950 border border-zinc-800 rounded-xl py-4 pl-14 pr-4 font-data-mono text-data-mono text-zinc-100 focus:outline-none focus:ring-1 focus:ring-sky-600 focus:border-sky-600 transition-all h-[56px]" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<!-- Service Selection -->
<div>
<label class="block font-label-caps text-label-caps text-zinc-400 mb-3 tracking-widest uppercase">Select Service</label>
<div class="flex flex-col gap-3">
<!-- Active Service Card -->
<button class="w-full text-left bg-sky-500/10 border border-sky-500 rounded-2xl p-4 flex items-start gap-4 transition-all h-auto min-h-[44px]">
<div class="w-10 h-10 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">science</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-zinc-100">Routine Blood Diagnostics</h3>
<p class="font-body-sm text-body-sm text-sky-400 mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">schedule</span> Est. Wait: ~12 min
                                    </p>
</div>
</button>
<!-- Muted Service Card -->
<button class="w-full text-left bg-zinc-950/50 border border-zinc-800 rounded-2xl p-4 flex items-start gap-4 hover:border-zinc-700 transition-all h-auto min-h-[44px]">
<div class="w-10 h-10 rounded-full bg-zinc-900 text-zinc-500 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">stethoscope</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-zinc-400">Specialist Consultation</h3>
<p class="font-body-sm text-body-sm text-zinc-600 mt-1">Requires referral</p>
</div>
</button>
</div>
</div>
</div>
<!-- Sticky CTA for Form -->
<div class="mt-6">
<button class="w-full h-[56px] bg-sky-600 hover:bg-sky-500 text-white rounded-2xl font-headline-sm text-headline-sm flex items-center justify-center gap-2 transition-colors shadow-lg shadow-sky-600/20" onclick="toggleState()">
                        Generate Digital Pass <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
<!-- State B: Digital Pass (Initially Hidden) -->
<div class="hidden flex-col items-center justify-center h-full min-h-[600px] opacity-0 transition-opacity duration-500" id="state-b">
<div class="w-full max-w-sm bg-white text-zinc-900 rounded-[2rem] p-8 flex flex-col items-center relative overflow-hidden shadow-xl border border-zinc-200">
<!-- Top accent line -->
<div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-sky-500 to-sky-400"></div>
<!-- Status Indicator -->
<div class="relative w-16 h-16 mb-6 flex items-center justify-center">
<div class="absolute inset-0 rounded-full border-2 border-emerald-500 pulse-ring"></div>
<div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center z-10">
<span class="material-symbols-outlined text-emerald-600" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<h2 class="font-headline-md text-headline-md text-center mb-1 text-zinc-900">You are 3rd in line</h2>
<p class="font-body-sm text-body-sm text-zinc-500 text-center mb-8">Please wait in the main lobby.</p>
<!-- ID Block -->
<div class="text-center mb-8 w-full border-y border-zinc-100 py-6">
<span class="block font-label-caps text-label-caps text-zinc-400 tracking-widest uppercase mb-2">Ticket ID</span>
<div class="font-data-mono-lg text-data-mono-lg text-zinc-950 tracking-tight">#LAB-104</div>
</div>
<!-- QR Code Placeholder -->
<div class="w-[160px] h-[160px] border-2 border-dashed border-zinc-200 rounded-2xl flex items-center justify-center bg-zinc-50 mb-8 relative">
<span class="material-symbols-outlined text-zinc-300 text-4xl">qr_code_2</span>
</div>
<p class="font-body-sm text-body-sm text-zinc-400 text-center max-w-[200px]">Present this QR code or ID at the front desk when called.</p>
</div>
<!-- Secondary Actions -->
<div class="flex gap-4 mt-8 w-full max-w-sm px-4">
<button class="flex-1 h-[44px] bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-zinc-300 rounded-xl font-body-md text-body-md transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">directions_run</span> Running Late
                    </button>
<button class="flex-1 h-[44px] bg-transparent border border-rose-900/50 hover:bg-rose-900/20 text-rose-400 rounded-xl font-body-md text-body-md transition-colors flex items-center justify-center">
                        Cancel Visit
                    </button>
</div>
<div class="mt-8">
<button class="text-zinc-500 underline text-sm" onclick="toggleState()">Back to Intake (Demo)</button>
</div>
</div>
</main>
<!-- Subtle bottom gradient for simulated scroll affordance -->
<div class="absolute bottom-0 left-0 w-full h-12 bg-gradient-to-t from-zinc-950 to-transparent pointer-events-none"></div>
</div>
<script>
        function toggleState() {
            const stateA = document.getElementById('state-a');
            const stateB = document.getElementById('state-b');
            const mainContainer = document.getElementById('main-container');

            if (stateA.classList.contains('hidden')) {
                // Show A, Hide B
                stateB.classList.remove('opacity-100');
                stateB.classList.add('opacity-0');
                
                setTimeout(() => {
                    stateB.classList.add('hidden');
                    stateB.classList.remove('flex');
                    
                    stateA.classList.remove('hidden');
                    stateA.classList.add('flex');
                    
                    // Trigger reflow
                    void stateA.offsetWidth;
                    
                    stateA.classList.remove('opacity-0');
                    stateA.classList.add('opacity-100');
                    mainContainer.scrollTo(0,0);
                }, 300);

            } else {
                // Show B, Hide A
                stateA.classList.remove('opacity-100');
                stateA.classList.add('opacity-0');
                
                setTimeout(() => {
                    stateA.classList.add('hidden');
                    stateA.classList.remove('flex');
                    
                    stateB.classList.remove('hidden');
                    stateB.classList.add('flex');
                    
                    // Trigger reflow
                    void stateB.offsetWidth;
                    
                    stateB.classList.remove('opacity-0');
                    stateB.classList.add('opacity-100');
                    mainContainer.scrollTo(0,0);
                }, 300);
            }
        }
    </script>
</body></html>

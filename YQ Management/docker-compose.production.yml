version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: yq-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-yq_queue}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - yq-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-yq_queue}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yq-redis
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - yq-network
    command: redis-server --appendonly yes

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: yq-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-yq_queue}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=https://${DOMAIN_APP}
      - APP_URL=https://${DOMAIN_APP}
      - BACKEND_URL=https://${DOMAIN_API}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - yq-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yq-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=https://${DOMAIN_API}
      - NEXT_PUBLIC_BACKEND_URL=https://${DOMAIN_API}
      - NEXT_PUBLIC_WS_URL=https://${DOMAIN_API}
      - NEXT_PUBLIC_SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
    depends_on:
      - backend
    networks:
      - yq-network

  caddy:
    image: caddy:2-alpine
    container_name: yq-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - yq-network

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  yq-network:
    driver: bridge

name: Deploy to Hostinger VPS

on:
  push:
    branches: [ "main" ]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ─── 1. Build & Type-check Frontend ────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.qmova.yqbuddy.com
          NEXT_PUBLIC_BACKEND_URL: https://api.qmova.yqbuddy.com
          NEXT_PUBLIC_WS_URL: https://api.qmova.yqbuddy.com
          NEXT_PUBLIC_SUPER_ADMIN_EMAIL: yqbuddysa@gmail.com

  # ─── 2. Build & Type-check Backend ─────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ─── 3. Deploy to Hostinger VPS via SSH ─────────────────────────────────────
  deploy-vps:
    name: Deploy to VPS
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://qmova.yqbuddy.com
    steps:
      - name: Trigger VPS Deploy Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            bash /var/www/yq/scripts/deploy.sh

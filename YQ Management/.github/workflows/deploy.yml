name: Deploy to Hostinger VPS

on:
  push:
    branches: [ "main" ]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: frontend
            context: ./frontend
            image: ghcr.io/${{ github.repository }}-frontend
            build-args: |
              NEXT_PUBLIC_API_URL=https://api.qmova.yqbuddy.com
              NEXT_PUBLIC_BACKEND_URL=https://api.qmova.yqbuddy.com
              NEXT_PUBLIC_WS_URL=https://api.qmova.yqbuddy.com
          - service: backend
            context: ./backend
            image: ghcr.io/${{ github.repository }}-backend
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}:latest,${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}

  deploy-vps:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: [self-hosted, yq-vps]
    environment:
      name: Production
      url: https://qmova.yqbuddy.com
    steps:
      - name: Run Deploy Script
        run: bash "/var/www/yq/YQ Management/scripts/deploy.sh"

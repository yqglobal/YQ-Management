<body class="bg-zinc-50 min-h-screen flex items-center justify-center p-4 font-body-md text-on-surface antialiased">
<div class="w-full max-w-2xl bg-card rounded-2.5xl shadow-[0_10px_15px_-3px_rgba(0,0,0,0.05)] border border-border p-8 md:p-12">
<div class="flex items-center gap-2 mb-10 w-full">
<div class="h-1 bg-sky-600 rounded-full flex-1"></div>
<div class="h-1 bg-surface-container-highest rounded-full flex-1"></div>
<div class="h-1 bg-surface-container-highest rounded-full flex-1"></div>
</div>
<div class="mb-10 text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Establish your tenant namespace</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Configure the core identity and operational model for your new Qmova environment.</p>
</div>
<form class="space-y-8">
<div class="space-y-2">
<label class="font-body-md text-body-md font-medium text-on-surface block" for="orgName">Organization Name</label>
<input class="w-full h-[56px] px-4 rounded-lg border border-border bg-canvas focus:border-sky-600 focus:ring-1 focus:ring-sky-600 outline-none transition-shadow font-body-lg text-body-lg placeholder:text-outline-variant" id="orgName" placeholder="Johns Hopkins Urgent Care" type="text"/>
</div>
<div class="space-y-2">
<label class="font-body-md text-body-md font-medium text-on-surface block" for="subdomain">Subdomain</label>
<div class="flex items-center h-[56px] rounded-lg border border-border bg-canvas overflow-hidden focus-within:border-sky-600 focus-within:ring-1 focus-within:ring-sky-600 transition-shadow">
<span class="px-4 py-2 font-data-mono text-data-mono text-on-surface-variant bg-surface-container-lowest border-r border-border h-full flex items-center select-none">https://</span>
<input class="flex-1 h-full px-4 border-none bg-transparent outline-none font-data-mono text-data-mono text-on-surface placeholder:text-outline-variant" id="subdomain" placeholder="namespace" type="text"/>
<span class="px-4 py-2 font-data-mono text-data-mono text-on-surface-variant bg-surface-container-lowest border-l border-border h-full flex items-center select-none">.qmova.com</span>
</div>
</div>
<div class="space-y-4">
<label class="font-body-md text-body-md font-medium text-on-surface block">Operating Model Selection</label>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<label class="relative flex cursor-pointer rounded-xl border p-5 transition-all bg-sky-50 border-sky-500 shadow-sm">
<input checked="" class="sr-only" name="operatingModel" type="radio" value="strict"/>
<div class="flex w-full items-start justify-between">
<div class="flex items-center">
<div class="text-sm">
<p class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-[20px] text-sky-600" style="font-variation-settings: 'FILL' 1;">view_list</span>
                                        Strict Queues
                                    </p>
<div class="text-on-surface-variant mt-2 font-body-sm text-body-sm">
                                        Linear ticket progression. Ideal for walk-ins and high-volume service desks.
                                    </div>
</div>
</div>
</div>
</label>
<label class="relative flex cursor-pointer rounded-xl border border-border p-5 transition-all bg-canvas hover:border-outline-variant">
<input class="sr-only" name="operatingModel" type="radio" value="dynamic"/>
<div class="flex w-full items-start justify-between">
<div class="flex items-center">
<div class="text-sm">
<p class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-[20px] text-outline">calendar_month</span>
                                        Dynamic Calendar
                                    </p>
<div class="text-on-surface-variant mt-2 font-body-sm text-body-sm">
                                        Appointment-based scheduling. Best for planned visits and consults.
                                    </div>
</div>
</div>
</div>
</label>
</div>
</div>

<button class="w-full sm:w-auto min-h-[44px] px-6 py-2 rounded-lg font-body-md text-body-md font-medium text-on-surface-variant hover:bg-surface-container-high transition-colors" type="button">
                    Back

<button class="w-full sm:w-auto min-h-[44px] px-8 py-2 rounded-lg font-body-md text-body-md font-medium bg-zinc-950 text-white hover:opacity-90 transition-opacity flex items-center justify-center gap-2" type="button">
